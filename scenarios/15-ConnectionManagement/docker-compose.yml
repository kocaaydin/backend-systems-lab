services:
  connection-api:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "15001:5001" # External 15001 -> Internal 5001
      - "15002:5001" # External 15002 -> Internal 5001
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Sadece 5001 yeterli, external 5002 de 5001'e maplendi.
      - ASPNETCORE_URLS=http://+:5001
    networks:
      - bench-net

networks:
  bench-net:
    driver: bridge
    name: bench-net # Bu isimle oluştur (prefix yok)
