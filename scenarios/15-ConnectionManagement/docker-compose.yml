services:
  connection-api:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "15001:5001" # External 15001 -> Internal 5001
      - "15002:5001" # External 15002 -> Internal 5001
      - "15011:5001" # Warm-up port for KeepAliveOff traffic
      - "15012:5001" # Warm-up port for KeepAliveOn traffic
      - "15021:5002" # HTTP/2 (h2c) measure port
      - "15022:5002" # HTTP/2 (h2c) warm-up port
      - "15031:5003" # HTTP/1.1 + TLS measure port
      - "15032:5003" # HTTP/1.1 + TLS warm-up port
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - bench-net

networks:
  bench-net:
    driver: bridge
    name: bench-net # Bu isimle oluştur (prefix yok)
