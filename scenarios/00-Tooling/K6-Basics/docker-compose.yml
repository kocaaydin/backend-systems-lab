services:
  k6-target-api:
    build:
      context: ./K6TargetApi
    container_name: k6-basics-api
    ports:
      - "5080:5080"

  k6:
    image: grafana/k6:0.49.0
    container_name: k6-basics-runner
    working_dir: /scripts
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    profiles:
      - tools
