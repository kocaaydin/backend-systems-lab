services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_bad_design_lab
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=VeryStrongPassword123!
      - MSSQL_PID=Developer
    ports:
      - "1436:1433"
    volumes:
      - mssql_bad_design_data:/var/opt/mssql
    restart: unless-stopped

  lab-seed:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      - mssql
    volumes:
      - ./QueryPerformance/bad_design_setup.sql:/scripts/bad_design_setup.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e

        if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
          SQLCMD=/opt/mssql-tools18/bin/sqlcmd
        elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then
          SQLCMD=/opt/mssql-tools/bin/sqlcmd
        else
          echo "sqlcmd binary not found in mssql-tools image"
          exit 1
        fi

        echo "Waiting for SQL Server to accept connections..."
        until $$SQLCMD -S mssql -U sa -P "VeryStrongPassword123!" -Q "SELECT 1" -C >/dev/null 2>&1; do
          sleep 3
        done

        echo "Running bad_design_setup.sql..."
        $$SQLCMD -S mssql -U sa -P "VeryStrongPassword123!" -d master -i /scripts/bad_design_setup.sql -C
        echo "Lab seed completed."
    restart: "no"

volumes:
  mssql_bad_design_data:
